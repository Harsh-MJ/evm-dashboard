name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Hand-benchmark checks (30)
        run: python -m pytest test_benchmark.py -q
      - name: Edge cases (14)
        run: python test_edge_cases.py
